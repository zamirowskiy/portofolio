<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Роман Замировский, фотограф. Предметная, коммерческая и автосъёмка.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Замировский Фото</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: контактный лист. Страница как лист фотобумаги, кадры пронумерованы сквозной нумерацией, красный только у номеров кадров. */
:root{
  --paper:#ECEDE8;
  --ink:#141512;
  --mute:#676A62;
  --line:#C6C8C0;
  --strip:#1A1B18;
  --safe:#B0281F;
  --display:"Fira Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121310;--ink:#E7E8E2;--mute:#8E9188;--line:#2D2F2A;--strip:#060705;--safe:#E2483C;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121310;--ink:#E7E8E2;--mute:#8E9188;--line:#2D2F2A;--strip:#060705;--safe:#E2483C;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{overflow-x:clip;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--safe);outline-offset:3px}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-decoration:none}
.logo span{color:var(--safe)}
.nav{display:flex;gap:18px;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--mute)}
.nav a:hover,.nav a.on{color:var(--ink)}

/* первый экран */
.hero{padding-block:clamp(28px,6vw,72px) 0}
.hero h1{font:800 clamp(40px,11vw,160px)/.84 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.01em}
.hero h1 .l2{display:block;padding-left:clamp(0px,6vw,96px)}
.hero-meta{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:28px;align-items:end}
.hero-meta p{margin:0;max-width:34ch;font-size:clamp(17px,1.6vw,20px);line-height:1.45}
.hero-meta .mono{color:var(--mute)}

/* разделы */
section{padding-block:clamp(48px,8vw,104px) 0;scroll-margin-top:60px}
.sec-head{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:12px}
.sec-head h2{font:800 clamp(44px,8vw,112px)/.85 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.sec-head .mono{color:var(--mute);text-align:right}
.sec-lead{max-width:60ch;color:var(--mute);margin:16px 0 0}

/* коллаж: кадры встык, ширина каждого пропорциональна его формату, поэтому высоты в ряду совпадают без обрезки */
.collage{width:100vw;margin-left:calc(50% - 50vw);margin-top:clamp(20px,3vw,36px)}
/* карусель: лента кадров встык, едет сама, на наведении стоит */
.marquee{overflow:hidden;margin-top:clamp(28px,5vw,56px);background:var(--strip)}
.track{display:flex;width:max-content;animation:roll var(--dur,120s) linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track figure{margin:0;flex:none;cursor:zoom-in}
.marquee .track img{display:block;height:clamp(220px,36vw,520px);width:auto;max-width:none}
@keyframes roll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee{overflow-x:auto}.track{animation:none}}
.crow{display:flex}
.frame{flex:var(--ar) 1 0;min-width:0;margin:0;overflow:hidden;cursor:zoom-in}
.frame img{display:block;width:100%;height:auto;transition:transform .6s ease}
.frame:hover img{transform:scale(1.025)}
@media (prefers-reduced-motion:reduce){.frame img{transition:none}.frame:hover img{transform:none}}
.crow.feature{display:grid}
.crow.feature .frame{flex:none}
.crow.feature>.frame img{height:100%;object-fit:cover}
.crow.feature .side{display:flex;flex-direction:column;min-width:0}
.crow.small{width:min(100%,920px);margin-inline:auto}
.crow.narrow{justify-content:center}
.crow.narrow .frame{flex:0 1 auto;width:min(100%,88vh)}
.proj{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:clamp(36px,5vw,64px);padding-bottom:8px;border-bottom:1px solid var(--line)}
.proj:first-child{margin-top:clamp(24px,3vw,36px)}
.proj h3{margin:0;font:600 clamp(22px,2.4vw,32px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.proj .mono{color:var(--mute)}
.proj + .collage{margin-top:14px}
@media (max-width:640px){.crow{flex-wrap:wrap}.crow.three .frame:first-child{flex-basis:100%}.crow.three .frame:not(:first-child){flex-basis:1px}}

/* обо мне */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);margin-top:28px}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.me{aspect-ratio:4/5;max-width:100%;background:var(--strip);position:relative;overflow:hidden;display:flex;align-items:end;padding:18px}
.me .ini{font:800 clamp(120px,22vw,260px)/.8 var(--display);color:#ECEDE8;opacity:.92;text-transform:uppercase}
.me .tag{position:absolute;top:16px;left:18px;color:#9A9D94;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.me img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.about-text p{margin:0 0 18px;max-width:62ch;font-size:clamp(16px,1.25vw,18px)}
.about-text p:first-child{font-size:clamp(20px,2vw,26px);line-height:1.35;font-weight:500}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 32px;margin-top:32px;border-top:1px solid var(--line)}
.kit div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kit dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.kit dd{margin:0}

/* контакты */
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 32px;margin-top:28px}
.c{border-top:1px solid var(--ink);padding:14px 0 26px;display:flex;flex-direction:column;gap:8px;min-width:0}
.c .mono{color:var(--mute)}
.c .val{font:600 clamp(22px,2.4vw,34px)/1.1 var(--display);overflow-wrap:anywhere;user-select:all}
.c .val a{text-decoration:none}
.c button{align-self:start;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:none;color:var(--ink);border:1px solid var(--line);padding:9px 12px;cursor:pointer}
.c button:hover{border-color:var(--ink)}
footer{padding-block:56px 40px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* просмотр кадра */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,9,7,.94);display:grid;grid-template-rows:1fr auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;min-height:0}
.lb-stage{min-height:0;display:flex}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#C9CBC4;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding-top:12px;flex-wrap:wrap}
.lb-bar b{color:#E2483C;font-weight:500;margin-right:10px}
.lb-btns{display:flex;gap:8px}
.lb button{background:none;border:1px solid #3A3C37;color:#ECEDE8;font:500 12px/1 var(--mono);padding:10px 14px;cursor:pointer;letter-spacing:.06em}
.lb button:hover{border-color:#ECEDE8}
</style>

</head>
<body>
<!-- Всё содержимое берётся из content.json. Править его удобнее через admin.html. -->
<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" id="logo"></a>
    <nav class="nav mono" aria-label="Разделы" id="nav"></nav>
  </div>
</header>

<main id="top"></main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр кадра">
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span id="lb-n"></span>
    <span class="lb-btns">
      <button type="button" id="lb-prev">← Назад</button>
      <button type="button" id="lb-next">Вперёд →</button>
      <button type="button" id="lb-x">Закрыть</button>
    </span>
  </div>
</div>

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const br=s=>esc(s).replace(/\n/g,"<br>");
const word=n=>{const a=n%10,b=n%100;return (a===1&&b!==11)?"кадр":(a>=2&&a<=4&&(b<12||b>14))?"кадра":"кадров"};
const main=document.getElementById("top");
let PH=[],io=null;

function render(D){
  /* сквозная нумерация кадров для просмотра */
  const num=new Map();PH=[];
  D.sections.forEach(s=>s.groups.forEach(g=>g.rows.forEach(r=>r.photos.forEach(p=>{num.set(p,PH.length);PH.push(p)}))));
  const ar=p=>+p.ar||1.5;
  const img=(p,lazy)=>`<img src="${esc(p.src)}" alt="${esc(p.alt)}"${lazy?' loading="lazy"':""} width="1600" height="${Math.round(1600/ar(p))}">`;
  const frame=p=>`<figure class="frame" style="--ar:${ar(p)}" data-i="${num.get(p)}" tabindex="0">${img(p,1)}</figure>`;
  const row=r=>{const ps=r.photos;if(!ps.length)return "";
    if((r.type==="feature"||r.type==="feature-rev")&&ps.length>1){
      const [f,...side]=ps,k=(ar(f)*side.reduce((a,p)=>a+1/ar(p),0)).toFixed(3),sd=`<div class="side">${side.map(frame).join("")}</div>`;
      return r.type==="feature-rev"?`<div class="crow feature" style="grid-template-columns:1fr ${k}fr">${sd}${frame(f)}</div>`:`<div class="crow feature" style="grid-template-columns:${k}fr 1fr">${frame(f)}${sd}</div>`;}
    return `<div class="crow${ps.length>2?" three":""}${ps.length===1&&ar(ps[0])<1.3?" narrow":""}">${ps.map(frame).join("")}</div>`};
  const cnt=g=>g.rows.reduce((a,r)=>a+r.photos.length,0);

  document.title=D.meta.title;
  document.querySelector('meta[name="description"]').content=D.meta.description;
  document.getElementById("logo").innerHTML=`${esc(D.logo[0])}<span>.</span>${esc(D.logo[1])}`;
  document.getElementById("nav").innerHTML=[...D.sections.map(s=>[s.id,s.title]),["about",D.about.title],["contacts",D.contacts.title]]
    .map(([id,t])=>`<a href="#${esc(id)}">${esc(t)}</a>`).join("");

  const strip=D.sections.filter(s=>s.marquee).flatMap(s=>s.groups.flatMap(g=>g.rows.flatMap(r=>r.photos)));
  const fig=(p,dup)=>`<figure class="frame" data-i="${num.get(p)}"${dup?' aria-hidden="true"':' tabindex="0"'}><img src="${esc(p.src)}" alt="${dup?"":esc(p.alt)}" width="1600" height="${Math.round(1600/ar(p))}"></figure>`;
  const dur=Math.round(strip.reduce((a,p)=>a+ar(p)*420,0)/70);

  const A=D.about,C=D.contacts;
  main.innerHTML=`
  <div class="hero wrap">
    <h1>${esc(D.hero.line1)}<span class="l2">${esc(D.hero.line2)}</span></h1>
    <div class="hero-meta"><p>${br(D.hero.text)}</p><span class="mono">${esc(D.hero.place)}</span></div>
  </div>
  ${strip.length?`<div class="marquee" aria-label="Избранные кадры"><div class="track" style="--dur:${dur}s">${strip.map(p=>fig(p)).join("")+strip.map(p=>fig(p,1)).join("")}</div></div>`:""}
  ${D.sections.map(s=>{const n=s.groups.reduce((a,g)=>a+cnt(g),0);
    return `<section id="${esc(s.id)}" class="wrap">
    <div class="sec-head"><h2>${esc(s.title)}</h2><span class="mono">${n} ${word(n)}</span></div>
    ${s.lead?`<p class="sec-lead">${br(s.lead)}</p>`:""}
    <div>${s.groups.map(g=>{const c=cnt(g);
      return (g.title?`<div class="proj"><h3>${esc(g.title)}</h3><span class="mono">${c} ${word(c)}</span></div>`:"")+`<div class="collage">${g.rows.map(row).join("")}</div>`}).join("")}</div>
  </section>`}).join("")}
  <section id="about" class="wrap">
    <div class="sec-head"><h2>${esc(A.title)}</h2><span class="mono">${esc(A.note)}</span></div>
    <div class="about">
      <div class="me">${A.photo?`<img src="${esc(A.photo)}" alt="${esc(A.tag)}">`:`<span class="tag">${esc(A.tag)}</span><span class="ini">${esc(A.initials)}</span>`}</div>
      <div class="about-text">
        ${A.paragraphs.filter(Boolean).map(p=>`<p>${br(p)}</p>`).join("")}
        ${A.kit.length?`<dl class="kit">${A.kit.map(x=>`<div><dt>${esc(x.k)}</dt><dd>${esc(x.v)}</dd></div>`).join("")}</dl>`:""}
      </div>
    </div>
  </section>
  <section id="contacts" class="wrap">
    <div class="sec-head"><h2>${esc(C.title)}</h2><span class="mono">${esc(C.note)}</span></div>
    <div class="contacts">${C.items.map((c,i)=>`<div class="c"><span class="mono">${esc(c.label)}</span><span class="val" id="v-${i}">${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.value)}</a>`:esc(c.value)}</span>${c.copy?`<button type="button" data-copy="v-${i}">Скопировать</button>`:""}</div>`).join("")}</div>
  </section>
  <footer class="wrap mono"><span>${esc(D.footer)}</span><span>${PH.length} ${word(PH.length)}</span></footer>`;

  /* подсветка раздела в меню */
  const links=[...document.querySelectorAll(".nav a")];
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section[id]").forEach(s=>io.observe(s));
}

/* просмотр */
const lb=document.getElementById("lb"),im=document.getElementById("lb-img");
let cur=0,last=null;
function show(i){cur=(i+PH.length)%PH.length;const p=PH[cur];im.src=p.src;im.alt=p.alt||"";
  document.getElementById("lb-n").textContent=`${cur+1} / ${PH.length}`;}
function open(i){last=document.activeElement;show(i);lb.hidden=false;document.body.style.overflow="hidden";document.getElementById("lb-x").focus();}
function close(){lb.hidden=true;document.body.style.overflow="";if(last)last.focus();}
document.addEventListener("click",e=>{const f=e.target.closest("[data-i]");if(f&&!f.closest(".lb"))open(+f.dataset.i);});
document.addEventListener("keydown",e=>{
  if(lb.hidden){const f=e.target.closest&&e.target.closest(".frame");if(f&&(e.key==="Enter"||e.key===" ")){e.preventDefault();open(+f.dataset.i);}return;}
  if(e.key==="Escape")close();if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1);});
document.getElementById("lb-x").onclick=close;
document.getElementById("lb-next").onclick=()=>show(cur+1);
document.getElementById("lb-prev").onclick=()=>show(cur-1);
lb.addEventListener("click",e=>{if(e.target===lb||e.target.classList.contains("lb-stage"))close();});

/* копирование */
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;
  const el=document.getElementById(b.dataset.copy),txt=el.textContent.trim();
  const done=()=>{b.textContent="Скопировано";setTimeout(()=>b.textContent="Скопировать",1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Выделено, нажми Ctrl+C"};
  try{navigator.clipboard.writeText(txt).then(done,sel)}catch(_){sel()}
});

/* загрузка: обычный режим берёт content.json, предпросмотр из админки получает данные сообщением */
if(new URLSearchParams(location.search).has("preview")){
  addEventListener("message",e=>{if(e.origin===location.origin&&e.data&&e.data.type==="zf-preview")render(e.data.content)});
  parent.postMessage({type:"zf-ready"},location.origin);
}else{
  fetch("content.json",{cache:"no-cache"}).then(r=>r.json()).then(D=>{render(D);
    if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}
  }).catch(()=>{main.innerHTML='<p class="wrap" style="padding-block:48px">Не получилось загрузить страницу. Обновите её.</p>'});
}
</script>
</body>
</html>
